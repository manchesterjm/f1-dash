services:
  api:
    image: ghcr.io/slowlydev/f1-dash-api:latest
    ports:
      - 4010:80
    environment:
      - RUST_LOG=api=debug
      - ADDRESS=0.0.0.0:80
      - ORIGIN=http://localhost:3000

  realtime:
    image: f1-dash-realtime:f1tv-login
    ports:
      - 4000:80
    environment:
      - RUST_LOG=realtime=debug
      - ADDRESS=0.0.0.0:80
      - ORIGIN=http://localhost:3000
      - F1_LOGIN_SESSION_FILE=/run/secrets/f1_login_session
    volumes:
      - /home/josh/.config/f1-dash/login_session:/run/secrets/f1_login_session:ro

  web:
    image: f1-dash-web:smooth-map
    depends_on:
      - realtime
      - api
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_LIVE_URL=http://localhost:4000
      - API_URL=http://api:80
